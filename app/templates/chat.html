{% extends "base.html" %}

{% block title %}Chat - Enterprise MP{% endblock %}

{% block content %}
<div class="card" style="height: 80vh; display: flex; flex-direction: column; padding: 0;">
    <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h2 id="chat-title" style="margin: 0;">Cargando chat...</h2>
        <a href="{{ url_for('main.index') }}" class="btn">Volver</a>
    </div>

    <div id="chat-box" style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem;">
    </div>

    <div style="padding: 1rem; border-top: 1px solid var(--border-color); display: flex; gap: 10px;">
        <input id="message-input" placeholder="Escribe un mensaje seguro..." style="margin: 0;">
        <button class="btn btn-primary" onclick="sendMessage()" style="width: auto; margin: 0; padding: 0 2rem;">Enviar</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('id');
    const chatName = urlParams.get('name');
    document.getElementById('chat-title').innerText = "👤 " + chatName;

    socket.on('message', function(data) {
        if(data.chat_id === chatId) {
            appendMessage(data.text, false, data.sender);
        }
    });

    function appendMessage(text, isMe, sender) {
        const div = document.createElement('div');
        div.style.maxWidth = "70%";
        div.style.padding = "0.8rem 1rem";
        div.style.borderRadius = "12px";
        div.style.alignSelf = isMe ? "flex-end" : "flex-start";
        div.style.backgroundColor = isMe ? "var(--accent-color)" : "var(--border-color)";
        div.style.color = isMe ? "white" : "var(--text-color)";

        div.innerHTML = `<small style="display: block; opacity: 0.7; margin-bottom: 4px;">${sender}</small> ${text}`;

        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value;
        if(!text.trim()) return;

        socket.emit('message', {
            chat_id: chatId,
            text: text,
            sender: "Admin"
        });

        appendMessage(text, true, "Tú");
        input.value = "";
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMessage();
    });
</script>
{% endblock %}
