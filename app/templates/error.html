{% extends "base.html" %}

{% block title %}Error - Enterprise MP{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem;">
    <h1 style="font-size: 4rem; color: var(--danger);">{{ code }}</h1>
    <h2>{{ title }}</h2>
    <p style="margin-bottom: 2rem;">{{ message }}</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn">Volver al Inicio Seguro</a>
</div>
{% endblock %}
