<!DOCTYPE html>
<html>
<head>
  <title>CHAT EN VIVO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <style>
    body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0}
    .top{background:#1a1a1a;padding:10px;display:flex;align-items:center;gap:10px}
    .btn{background:#333;color:#fff;border:0;padding:8px;cursor:pointer}
    .chat-box{height:70vh;overflow:auto;background:#181818;padding:10px;display:flex;flex-direction:column;gap:5px}
    .input-area{padding:10px;display:flex;gap:10px}
    input{flex:1;padding:10px;background:#222;border:0;color:#fff}
    .msg{background:#222;padding:8px;border-radius:5px;max-width:80%}
    .msg.me{background:#333;align-self:flex-end}
  </style>
</head>
<body>

<div class="top">
  <button class="btn" onclick="location.href='/'">Atrás</button>
  <h2 id="chat-title">Cargando...</h2>
</div>

<div class="chat-box" id="messages">
</div>

<div class="input-area">
  <input id="message-input" placeholder="Escribe mensaje...">
  <button class="btn" onclick="sendMessage()">Enviar</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('id');
  const chatName = urlParams.get('name');

  document.getElementById('chat-title').innerText = "💬 " + chatName;

  const socket = io();

  socket.on('message', function(data) {
    if(data.chat_id === chatId) {
      appendMessage(data.text, false);
    }
  });

  function appendMessage(text, isMe) {
    const div = document.createElement('div');
    div.className = "msg" + (isMe ? " me" : "");
    div.innerText = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value;
    if(text.trim() === "") return;

    const data = {
      chat_id: chatId,
      text: text,
      sender: "Admin"
    };

    socket.emit('message', data);
    appendMessage(text, true);
    input.value = "";
  }

  document.getElementById('message-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });
</script>

</body>
</html>
